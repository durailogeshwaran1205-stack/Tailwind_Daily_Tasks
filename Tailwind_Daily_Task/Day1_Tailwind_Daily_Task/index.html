<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>College Application</title>

  <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="min-h-screen bg-gradient-to-br from-blue-50 to-indigo-100">

  <!-- Header -->
  <header class="bg-indigo-700 text-white shadow-lg">
    <div class="max-w-6xl mx-auto px-6 py-5 flex justify-between items-center">
      <div>
        <h1 class="text-2xl font-bold">EduCollege</h1>
        <p class="text-indigo-200 text-sm">Online Application Portal</p>
      </div>

      <a href="#" class="bg-white text-indigo-700 px-4 py-2 rounded-lg font-medium hover:bg-indigo-50">
        Sign In
      </a>
    </div>
  </header>

  <!-- Main Content -->
  <main class="max-w-4xl mx-auto px-6 py-10">

    <!-- Progress -->
    <div class="mb-8">
      <div class="flex justify-between text-sm font-medium text-gray-600 mb-2">
        <span>Application Progress</span>
        <span>Step 1 of 3</span>
      </div>

      <div class="w-full bg-gray-200 rounded-full h-3">
        <div class="bg-indigo-600 h-3 rounded-full w-1/3"></div>
      </div>
    </div>

    <!-- Application Form -->
    <form class="bg-white rounded-2xl shadow-xl overflow-hidden">

      <!-- Form Header -->
      <div class="bg-indigo-600 px-8 py-6 text-white">
        <h2 class="text-2xl font-bold">College Application Form</h2>
        <p class="text-indigo-100 mt-1">
          Please complete all required fields.
        </p>
      </div>

      <div class="p-8 space-y-10">

        <!-- Personal Information -->
        <section>
          <h3 class="text-xl font-bold text-gray-800 border-b pb-3 mb-6">
            Personal Information
          </h3>

          <div class="grid md:grid-cols-2 gap-6">

            <div>
              <label class="block text-sm font-medium text-gray-700 mb-2">
                First Name *
              </label>
              <input
                type="text"
                placeholder="Enter your first name"
                class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-indigo-500 focus:outline-none"
              />
            </div>

            <div>
              <label class="block text-sm font-medium text-gray-700 mb-2">
                Last Name *
              </label>
              <input
                type="text"
                placeholder="Enter your last name"
                class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-indigo-500 focus:outline-none"
              />
            </div>

            <div>
              <label class="block text-sm font-medium text-gray-700 mb-2">
                Email Address *
              </label>
              <input
                type="email"
                placeholder="example@email.com"
                class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-indigo-500 focus:outline-none"
              />
            </div>

            <div>
              <label class="block text-sm font-medium text-gray-700 mb-2">
                Phone Number *
              </label>
              <input
                type="tel"
                placeholder="+91 98765 43210"
                class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-indigo-500 focus:outline-none"
              />
            </div>

            <div>
              <label class="block text-sm font-medium text-gray-700 mb-2">
                Date of Birth
              </label>
              <input
                type="date"
                class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-indigo-500 focus:outline-none"
              />
            </div>

            <div>
              <label class="block text-sm font-medium text-gray-700 mb-2">
                Gender
              </label>
              <select class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-indigo-500 focus:outline-none">
                <option>Select an option</option>
                <option>Male</option>
                <option>Female</option>
                <option>Other</option>
                <option>Prefer not to say</option>
              </select>
            </div>

          </div>
        </section>

        <!-- Address -->
        <section>
          <h3 class="text-xl font-bold text-gray-800 border-b pb-3 mb-6">
            Address Information
          </h3>

          <div class="space-y-6">

            <div>
              <label class="block text-sm font-medium text-gray-700 mb-2">
                Full Address
              </label>
              <textarea
                rows="3"
                placeholder="Enter your complete address"
                class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-indigo-500 focus:outline-none"
              ></textarea>
            </div>

            <div class="grid md:grid-cols-3 gap-6">

              <div>
                <label class="block text-sm font-medium text-gray-700 mb-2">
                  City
                </label>
                <input
                  type="text"
                  placeholder="City"
                  class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-indigo-500 focus:outline-none"
                />
              </div>

              <div>
                <label class="block text-sm font-medium text-gray-700 mb-2">
                  State
                </label>
                <input
                  type="text"
                  placeholder="State"
                  class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-indigo-500 focus:outline-none"
                />
              </div>

              <div>
                <label class="block text-sm font-medium text-gray-700 mb-2">
                  ZIP / PIN Code
                </label>
                <input
                  type="text"
                  placeholder="600001"
                  class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-indigo-500 focus:outline-none"
                />
              </div>

            </div>
          </div>
        </section>

        <!-- Academic Information -->
        <section>
          <h3 class="text-xl font-bold text-gray-800 border-b pb-3 mb-6">
            Academic Information
          </h3>

          <div class="grid md:grid-cols-2 gap-6">

            <div>
              <label class="block text-sm font-medium text-gray-700 mb-2">
                Previous School / College *
              </label>
              <input
                type="text"
                placeholder="Enter institution name"
                class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-indigo-500 focus:outline-none"
              />
            </div>

            <div>
              <label class="block text-sm font-medium text-gray-700 mb-2">
                Graduation Year *
              </label>
              <select class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-indigo-500 focus:outline-none">
                <option>Select year</option>
                <option>2026</option>
                <option>2025</option>
                <option>2024</option>
                <option>2023</option>
              </select>
            </div>

            <div>
              <label class="block text-sm font-medium text-gray-700 mb-2">
                Percentage / GPA *
              </label>
              <input
                type="text"
                placeholder="Example: 85% or 8.5 GPA"
                class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-indigo-500 focus:outline-none"
              />
            </div>

            <div>
              <label class="block text-sm font-medium text-gray-700 mb-2">
                Preferred Program *
              </label>
              <select class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-indigo-500 focus:outline-none">
                <option>Select a program</option>
                <option>Computer Science</option>
                <option>Business Administration</option>
                <option>Mechanical Engineering</option>
                <option>Artificial Intelligence</option>
                <option>Data Science</option>
                <option>Psychology</option>
              </select>
            </div>

          </div>
        </section>

        <!-- Documents -->
        <section>
          <h3 class="text-xl font-bold text-gray-800 border-b pb-3 mb-6">
            Upload Documents
          </h3>

          <div class="grid md:grid-cols-2 gap-6">

            <label class="border-2 border-dashed border-gray-300 rounded-xl p-6 text-center cursor-pointer hover:border-indigo-500 transition">
              <div class="text-4xl mb-3">📄</div>
              <p class="font-medium text-gray-700">Upload Academic Transcript</p>
              <p class="text-sm text-gray-500 mt-1">PDF, JPG or PNG</p>
              <input type="file" class="hidden" />
            </label>

            <label class="border-2 border-dashed border-gray-300 rounded-xl p-6 text-center cursor-pointer hover:border-indigo-500 transition">
              <div class="text-4xl mb-3">👤</div>
              <p class="font-medium text-gray-700">Upload Profile Photo</p>
              <p class="text-sm text-gray-500 mt-1">JPG or PNG</p>
              <input type="file" class="hidden" />
            </label>

          </div>
        </section>

        <!-- Personal Statement -->
        <section>
          <h3 class="text-xl font-bold text-gray-800 border-b pb-3 mb-6">
            Personal Statement
          </h3>

          <textarea
            rows="6"
            placeholder="Tell us why you want to join our college and what your goals are..."
            class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-indigo-500 focus:outline-none"
          ></textarea>
        </section>

        <!-- Declaration -->
        <div class="bg-indigo-50 border border-indigo-100 p-5 rounded-xl">
          <label class="flex items-start gap-3 cursor-pointer">
            <input
              type="checkbox"
              class="mt-1 w-5 h-5 text-indigo-600 rounded focus:ring-indigo-500"
            />
            <span class="text-sm text-gray-700">
              I confirm that the information provided in this application is
              accurate and complete to the best of my knowledge.
            </span>
          </label>
        </div>

      </div>

      <!-- Form Actions -->
      <div class="bg-gray-50 px-8 py-6 flex flex-col sm:flex-row justify-between gap-4 border-t">

        <button
          type="button"
          class="px-6 py-3 border border-gray-300 rounded-lg text-gray-700 font-medium hover:bg-gray-100"
        >
          Save as Draft
        </button>

        <button
          type="submit"
          class="px-8 py-3 bg-indigo-600 text-white rounded-lg font-semibold hover:bg-indigo-700 shadow-md hover:shadow-lg transition"
        >
          Submit Application →
        </button>

      </div>

    </form>

  </main>

  <!-- Footer -->
  <footer class="text-center py-6 text-gray-500 text-sm">
    © 2026 EduCollege. All rights reserved.
  </footer>

</body>
</html>
